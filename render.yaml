
services:
  - type: web
    name: pennywise-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/expense_tracker.db
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
